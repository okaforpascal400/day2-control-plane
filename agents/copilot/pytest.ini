[pytest]
testpaths = tests
addopts = -q
# Same convention as the other agent packages: state the import roots so bare
# `pytest` and `python -m pytest` behave identically. `.` puts the `copilot`
# package on the path, `mcp-server` puts `day2_mcp` there (the copilot drives
# the MCP tools directly rather than over a socket), and `../core` is the shared
# agent library.
pythonpath = . mcp-server ../core
